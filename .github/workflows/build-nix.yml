name: Build Nix and cache it. Regenerate settings.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - niri-test
    tags:
      - 'v*'

jobs:
  build-and-push:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: build
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v14
        with:
          name: xaltsc-jfnd
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build packages and push to cachix
        run: nix build .

  regen-settings:
    permissions:
      contents: write
      pull-requests: write
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v14
        with:
          name: xaltsc-jfnd
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Build packages and push to cachix
        run: nix run . -- --generate-settings-schema > dev/nix/home/_settings.json
      - name: Create PR if needed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "flake: update settings schema"
          title: "Update settings schema"
          body: "Auto-generated by CI."
          branch: auto-update-settings-schema
          delete-branch: true
          labels: |
            settings
            automated
            nix
